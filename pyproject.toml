[project]
license = "Apache-2.0"
name = "adal"
version = "0.1.0"
description = "adaL: a language model with Glyphh's memory in it. Tell it a fact once; it remembers, takes the correction and forgets nothing else."
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # The Ada kernel (the meaning encoding the memory keys on): the private ada-private repo at a pinned commit,
    # never published. CI reads it with a read-only deploy key (the ADA_DEPLOY_KEY secret), as the server does.
    "glyphh-kernel @ git+https://github.com/glyphh-ai/ada-private@b30dd510160a81464a792bf514e107a9d8c748bd",
]

[project.optional-dependencies]
# The local backend: Apple silicon, MLX. The model tests (pytest -m model) run on it.
mlx = ["mlx-lm>=0.28"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]

[project.scripts]
adal = "adal.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true  # the kernel, from its private repo at a pinned commit

[tool.hatch.build.targets.wheel]
packages = ["src/adal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: needs a real model (ADAL_MODEL) and the mlx extra; run with `pytest -m model`"]
addopts = "-m 'not model'"

[tool.ruff]
line-length = 120
